<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>pedit architecture: you and Claude both edit through one EditSession</title>
  <style>
    .t { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .s { fill: #59636e; font-size: 12.5px; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .lbl { fill: #59636e; font-size: 12px; font-weight: 500; }
    .ph { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .pm { fill: #59636e; font-size: 12px; }
    .panel { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1; }
    .card { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1; }
    .core { fill: #ffffff; stroke: #1f2328; stroke-width: 1.75; }
    .you { stroke: #0969da; } .youf { fill: #0969da; }
    .cl { stroke: #bc4c2e; } .clf { fill: #bc4c2e; }
    .md { stroke: #818b98; } .mdf { fill: #818b98; }
    .ln { fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .bg { fill: #f6f8fa; }
    @media (prefers-color-scheme: dark) {
      .t, .ph { fill: #e6edf3; }
      .s, .lbl, .pm { fill: #9198a1; }
      .panel { fill: #151b23; stroke: #3d444d; }
      .card { fill: #0d1117; stroke: #3d444d; }
      .core { fill: #0d1117; stroke: #e6edf3; }
      .you { stroke: #4493f8; } .youf { fill: #4493f8; }
      .cl { stroke: #e2805f; } .clf { fill: #e2805f; }
      .md { stroke: #9198a1; } .mdf { fill: #9198a1; }
      .bg { fill: #151b23; }
    }
  </style>
  <defs>
    <marker id="hy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9z" class="youf"/></marker>
    <marker id="hc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9z" class="clf"/></marker>
    <marker id="hm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9z" class="mdf"/></marker>
  </defs>

  <!-- the two editors -->
  <rect x="80" y="28" width="240" height="72" rx="12" class="card"/>
  <circle cx="102" cy="55" r="5" class="youf"/>
  <text x="116" y="60" class="t">You</text>
  <text x="98" y="84" class="s">click, drag, type, shortcuts</text>

  <rect x="880" y="28" width="240" height="72" rx="12" class="card"/>
  <circle cx="902" cy="55" r="5" class="clf"/>
  <text x="916" y="60" class="t">Claude Code</text>
  <text x="898" y="84" class="s">your own logged-in <tspan class="m">claude</tspan> CLI</text>

  <!-- legend -->
  <g transform="translate(468 52)">
    <path d="M0 6h26" class="ln you"/><text x="34" y="10" class="lbl">your edits</text>
    <path d="M110 6h26" class="ln cl"/><text x="144" y="10" class="lbl">Claude's edits</text>
    <path d="M0 30h26" class="ln md" stroke-dasharray="4 4"/><text x="34" y="34" class="lbl">media and state</text>
  </g>

  <!-- process panels -->
  <rect x="40" y="148" width="320" height="462" rx="18" class="panel"/>
  <text x="62" y="176" class="ph">Renderer</text><text x="134" y="176" class="pm">React · Zustand</text>
  <rect x="400" y="148" width="760" height="462" rx="18" class="panel"/>
  <text x="422" y="176" class="ph">Main process</text><text x="522" y="176" class="pm">Node · Electron</text>

  <!-- renderer cards -->
  <rect x="70" y="206" width="260" height="76" rx="10" class="card"/>
  <text x="88" y="236" class="t">Timeline &amp; panels</text>
  <text x="88" y="259" class="s">canvas timeline, library, properties</text>

  <rect x="70" y="328" width="260" height="76" rx="10" class="card"/>
  <text x="88" y="358" class="t">Chat</text>
  <text x="88" y="381" class="s">shows Claude's steps as they stream</text>

  <rect x="70" y="462" width="260" height="110" rx="10" class="card"/>
  <text x="88" y="492" class="t">Preview player</text>
  <text x="88" y="516" class="s">WebCodecs decode → WebGL2</text>
  <text x="88" y="536" class="s">two video lanes, audio fades</text>
  <text x="88" y="556" class="s">transitions ported from <tspan class="m">xfade</tspan></text>

  <!-- main cards -->
  <rect x="440" y="200" width="290" height="98" rx="12" class="core"/>
  <text x="460" y="232" class="t">EditSession</text>
  <text x="460" y="256" class="s">one command model for both editors</text>
  <text x="460" y="278" class="s">real + draft · revisions · undo/redo</text>

  <rect x="870" y="206" width="250" height="76" rx="10" class="card"/>
  <text x="888" y="236" class="t">MCP server</text>
  <text x="888" y="259" class="s">35 tools · local HTTP</text>

  <rect x="870" y="328" width="250" height="76" rx="10" class="card"/>
  <text x="888" y="358" class="t">Claude runner</text>
  <text x="888" y="381" class="s m">claude -p · stream-json</text>

  <rect x="440" y="462" width="290" height="110" rx="10" class="card"/>
  <text x="460" y="492" class="t">FFmpeg jobs</text>
  <text x="460" y="516" class="s">probe, thumbnails, waveforms</text>
  <text x="460" y="536" class="s">proxies on NVENC / QSV / VAAPI</text>
  <text x="460" y="556" class="s">HDR tone-mapped once, for both sides</text>

  <rect x="870" y="480" width="250" height="74" rx="10" class="card"/>
  <text x="888" y="510" class="t">Exported video</text>
  <text x="888" y="533" class="s">one filter graph · 16:9, 9:16, 1:1</text>

  <!-- your path -->
  <path d="M200 100V204" class="ln you" marker-end="url(#hy)"/>
  <path d="M330 232H438" class="ln you" marker-end="url(#hy)"/>
  <text x="384" y="222" class="lbl" text-anchor="middle">commands</text>
  <path d="M440 260H332" class="ln md" stroke-dasharray="4 4" marker-end="url(#hm)"/>
  <text x="384" y="279" class="lbl" text-anchor="middle">state</text>

  <!-- Claude's path -->
  <path d="M330 366H868" class="ln cl" marker-end="url(#hc)"/>
  <text x="800" y="356" class="lbl" text-anchor="middle">your message</text>
  <path d="M1120 366H1140V64H1122" class="ln cl" marker-end="url(#hc)"/>
  <text x="1131" y="128" class="lbl" text-anchor="end">spawns</text>
  <path d="M960 100V204" class="ln cl" marker-end="url(#hc)"/>
  <text x="970" y="140" class="lbl">tool calls</text>
  <path d="M870 244H732" class="ln cl" marker-end="url(#hc)"/>
  <text x="801" y="234" class="lbl" text-anchor="middle">edits → draft</text>

  <!-- media path -->
  <path d="M585 298V460" class="ln md" stroke-dasharray="4 4" marker-end="url(#hm)"/>
  <rect x="594" y="420" width="58" height="18" rx="4" class="bg"/>
  <text x="598" y="433" class="lbl">timeline</text>
  <path d="M440 517H332" class="ln md" stroke-dasharray="4 4" marker-end="url(#hm)"/>
  <text x="386" y="507" class="lbl" text-anchor="middle">proxies</text>
  <path d="M730 517H868" class="ln md" stroke-dasharray="4 4" marker-end="url(#hm)"/>
  <text x="800" y="507" class="lbl" text-anchor="middle">export</text>
</svg>
